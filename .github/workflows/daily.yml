name: Daily forecast

# Institutes publish through the day and the Commission des sondages notices
# follow; the compiled source rebuilds on its own schedule. Running at 05:20
# UTC picks up everything filed the previous day.
on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  contents: write
  # So a failing run can open an issue about itself. A red cron job notifies
  # nobody by default, and this one stayed red for a fortnight unnoticed.
  issues: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      # Fetch BEFORE testing. The suite asserts that the roster can read every
      # polled candidate, and that assertion is only worth anything against the
      # data this run is about to use. Testing the committed cache first passes
      # happily and then the fetch introduces a candidate nobody has mapped -
      # which is exactly how a new name went unnoticed for two days.
      - name: Fetch polls
        run: presidentielle fetch

      - name: Test
        # Runs against the data just fetched, so an unreadable record fails
        # here rather than producing a forecast from a narrowed field.
        run: pytest -q

      - name: Audit
        # Prints anything the roster failed closed on. A new candidate being
        # tested shows up here as skipped records before it can quietly shrink
        # the sample. It also reports polls the Commission des sondages has on
        # file that the feed lacks (checked during Fetch), as annotations on
        # this run's summary page - never as a failure.
        run: presidentielle audit

      - name: Run the model
        env:
          PYTENSOR_FLAGS: cxx=
        run: presidentielle run --quiet

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # partis.json too: `run` rewrites it, so a change to
          # config/partis.yaml reaches the site without anyone
          # remembering to regenerate it.
          git add site/data/forecast.json site/data/partis.json outputs/runs data/cache
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "Forecast update $(date -u +%Y-%m-%d)"
            git push
          fi

  # Deploys the forecast this run just committed. pages.yml cannot do it: a
  # commit made with GITHUB_TOKEN does not trigger other workflows. Shares the
  # `pages` concurrency group with that file so the two never collide.
  pages:
    needs: forecast
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  # --- tell somebody -------------------------------------------------------
  # A scheduled workflow that fails notifies nobody. This one broke on
  # 2026-09-22 when the upstream feed changed shape, and went on failing for
  # fourteen days while the site served a fortnight-old forecast.
  #
  # An issue is the cheapest channel that reaches a person without anyone
  # subscribing to anything: GitHub notifies the repository owner when one is
  # opened. One issue is REUSED across consecutive failures, so a week of
  # breakage is one thread rather than seven, and the next success closes it,
  # which also stops a transient runner hiccup from leaving litter behind.
  #
  # It is a JOB needing BOTH others, not a step inside `forecast`. As a step it
  # could only see its own job, so a `pages` failure - the forecast computed
  # but never published - left the run red with nobody told. Found by testing
  # the notifier rather than trusting it.
  #
  # It cannot cover a run that never starts: GitHub failed to allocate a runner
  # twice on 2026-10-05 ("The job was not acquired by Runner of type hosted"),
  # and no step runs in a job that never began. The page reporting the age of
  # its own data (`renderStale` in site/js/app.js) is the guard for that.
  notify:
    needs: [forecast, pages]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or close the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FORECAST: ${{ needs.forecast.result }}
          PAGES: ${{ needs.pages.result }}
        run: |
          set -euo pipefail
          gh label create daily-run --repo "$REPO" --color b60205 --description "The daily forecast run is failing" 2>/dev/null || true
          open=$(gh issue list --repo "$REPO" --label daily-run --state open --json number --jq '.[0].number // empty')

          if [ "$FORECAST" = success ] && [ "$PAGES" = success ]; then
            for n in $open; do
              gh issue close "$n" --repo "$REPO" --comment "Fixed: the run succeeded on $(date -u +%F). $RUN_URL"
            done
            exit 0
          fi

          body="The daily forecast run failed on $(date -u +%F).

          - forecast: $FORECAST
          - pages: $PAGES

          $RUN_URL

          The site keeps serving the last good forecast until this is fixed, and says on the page itself once that forecast is more than three days old."
          if [ -z "$open" ]; then
            gh issue create --repo "$REPO" --title "Daily forecast is failing" --label daily-run --body "$body"
          else
            gh issue comment "$open" --repo "$REPO" --body "$body"
          fi
