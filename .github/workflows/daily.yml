name: Daily forecast

# Institutes publish through the day and the Commission des sondages notices
# follow; the compiled source rebuilds on its own schedule. Running at 05:20
# UTC picks up everything filed the previous day.
on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:

concurrency:
  group: forecast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        # Runs against the committed cache, so a broken upstream file fails
        # here rather than silently producing a forecast from stale data.
        run: pytest -q

      - name: Fetch polls
        run: presidentielle fetch

      - name: Audit
        # Prints anything the roster failed closed on. A new candidate being
        # tested shows up here as skipped records before it can quietly shrink
        # the sample.
        run: presidentielle audit

      - name: Run the model
        env:
          PYTENSOR_FLAGS: cxx=
        run: presidentielle run --quiet

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/forecast.json outputs/runs data/cache
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "Forecast update $(date -u +%Y-%m-%d)"
            git push
          fi

  pages:
    needs: forecast
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
