# Commission des sondages notices that a PERSON has read and ruled on.
#
# `presidentielle audit` compares the poll feed with the Commission's notice
# catalog and reads every notice the feed lacks (src/presidentielle/data/
# commission.py). Its classifier is a pattern match, so some notices need a
# human verdict. Anything listed here is no longer warned about, but a
# `manquante` one is still reported every run as a known gap until it
# reaches the feed.
#
# statut:
#   manquante          a 2027 voting-intention poll the feed does not have
#   ecartee_upstream   a voting-intention poll upstream has read and declined
#   dans_le_flux       already in the feed, under another filename
#   pas_une_intention  not a 2027 voting-intention poll
#
# Only add an entry after reading the notice itself, and say what it asks.
#
# `manquante` versus `ecartee_upstream`: the first is worth reporting upstream,
# the second is not - they have seen it and said no, and filing it again would
# relitigate their decision. Both stay visible, because either way it is a real
# poll this forecast does not see.

notices:

  # --- real gaps -------------------------------------------------------------

  9927-pres-toluna-hi-regards-30-avril.pdf:
    statut: ecartee_upstream
    note: >-
      Toluna Harris Interactive for Regards, fieldwork 24-25 April 2025, 1 189
      respondents (1 035 registered voters). First-round voting intentions, but
      its hypotheses name an unnamed "gauche unie" candidate rather than a
      person. Upstream read it and declined to carry it for exactly that reason
      (MieuxVoter/presidentielle2027#4, closed 2026-05-27: "je ne veux pas
      inclure ce sondage car il ne designe pas des personnes"). Not a gap to
      report again. Read 2026-09-21, rechecked 2026-10-14.

  10218-pres-election-2027-opinionway-le-figaro-3-juillet.pdf:
    statut: manquante
    note: >-
      OpinionWay for Fondapol, fieldwork 1-8 June 2026, 3 057 registered
      voters. Second-round head-to-heads (Philippe, Attal, Retailleau each
      against Bardella and Melenchon), plus potential-vote items. The only
      OpinionWay polls in the feed around then are the 10-11 June JDD wave and
      the 8-9 July Presitrack. The commissioner is Fondapol, not Le Figaro as
      the filename suggests. Reported upstream as
      MieuxVoter/presidentielle2027#260 on 2026-10-14, with the 13 duels
      transcribed; their own automated issue #101 had been closed on
      2026-07-16 without the data landing. Read 2026-09-21.

  # --- in the feed under another filename -----------------------------------

  10035-pres-verian-lhemicycle-12-decembre.pdf:
    statut: dans_le_flux
    note: >-
      Same Verian / L'Hemicycle poll (fieldwork 18-20 November 2025) that the
      feed already carries as 10024-pres-verian-lhemicycle-27-novembre.pdf -
      a re-filed notice, not a second poll.

  10284-pres-barometre-election-v6-ifop-30-septembre.pdf:
    statut: dans_le_flux
    note: >-
      Ifop-Fiducial for LCI, Le Figaro and Sud Radio, vague 6, fieldwork to
      29 September 2026, nine first-round hypotheses. The catalog lists notice
      10284 under TWO filenames; the feed carries the longer one,
      10284-pres-barometre-election-presidentielle-v6-ifop-le-figaro-30-septembre.pdf.
      Not a gap - the comparison is by filename, so the second spelling reads
      as missing. Read 2026-10-14.

  10167-pres-odoxa-31-mars.pdf:
    statut: dans_le_flux
    note: >-
      Odoxa for Mascaret / Public Senat, fieldwork 25-26 March 2026. In the
      feed as barometre-odoxa-mascaret-mars-2026.pdf.

  # --- not voting intentions -------------------------------------------------

  9988-leg-pres-odoxa-backbone-le-figaro-2-octobre.pdf:
    statut: pas_une_intention
    note: >-
      Asks how people would vote in a LEGISLATIVE contest after a dissolution
      (RN candidate against a Nouveau Front populaire one), not a presidential
      one. Filed under "Pres" upstream.

  10175-pres-femme-elysee-opinionway-challenges-22-avril.pdf:
    statut: pas_une_intention
    note: >-
      "Pourriez-vous voter pour chacune des personnalites suivantes" - potential
      vote for named women, answered per personality. A potential, not an
      intention.

  10210-pres-seconds-tours-ifop-marianne-24-juin.pdf:
    statut: pas_une_intention
    note: >-
      Ifop for Marianne, "Les seconds tours souhaites": which runoff people
      WANT to see, not how they would vote in one.

  10255-pres-csa-cnews-8-septembre.pdf:
    statut: pas_une_intention
    note: >-
      CSA for CNews / Europe 1 / JDD, "Les attentes des Francais envers le
      futur president" - priorities for the next president.

  # --- the Elabe notices --------------------------------------------------
  # None of these four could be read by `commission.pdf_text`: Elabe embeds
  # subset CID fonts, so the TJ operands are glyph ids rather than literal
  # strings, and the reader - which deliberately does no font decoding - sees
  # nothing. They were read by hand on 2026-10-14 (text layer extracted with
  # pypdf). Every future Elabe notice will arrive the same way.

  10169-pres-les-francais-et-le-president-ideal-elabe-18-avril.pdf:
    statut: pas_une_intention
    note: >-
      Elabe for La Tribune Dimanche, fieldwork 14-15 April 2026, 1 000 people.
      "Les Francais et le(la) president(e) ideal(e)": what PROFILE would make a
      good president (politician, company head, academic...), which qualities,
      what age, what political positioning. Names no candidate anywhere and
      asks for no vote. Read by hand 2026-10-14.

  10198-pres-observatoire-elabe-4-juin.pdf:
    statut: pas_une_intention
    note: >-
      Elabe for Les Echos, "L'Observatoire Politique - Juin 2026", fieldwork
      2-3 June 2026, 1 001 people. Trust in the President and the Prime
      Minister, then positive/negative image for 31 personalities. An image
      barometer, not a voting intention. Read by hand 2026-10-14.

  10285-pres-observatoire-politique-elabe-1er-octobre.pdf:
    statut: pas_une_intention
    note: >-
      Elabe for Les Echos, "L'Observatoire politique - Octobre 2026", fieldwork
      29-30 September 2026, 1 000 people. The same two trust questions and the
      same image battery, for 31 personalities. No vote question. Read by hand
      2026-10-14.

  10286-pres-budget-2027-elabe-1er-octobre.pdf:
    statut: pas_une_intention
    note: >-
      Elabe for Les Echos, "Les Francais et le budget 2027", fieldwork 29-30
      September 2026, 1 000 people. The 2027 state budget: where the deficit
      effort should fall, whether oppositions should censure, and support for
      a list of specific measures. "2027" here is a budget year, not a
      ballot. Read by hand 2026-10-14.
