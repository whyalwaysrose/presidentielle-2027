  DL:   { nom: "David Lisnard",           parti: "Les Républicains",              bloc: droite }
  GL:   { nom: "Gérard Larcher",          parti: "Les Républicains",              bloc: droite }
  MBa:  { nom: "Michel Barnier",          parti: "Les Républicains",              bloc: droite }
  FXB:  { nom: "François-Xavier Bellamy", parti: "Les Républicains",              bloc: droite }
  JC:   { nom: "Jean Castex",             parti: "Divers droite",                 bloc: droite }
  NS:   { nom: "Nicolas Sarkozy",         parti: "Les Républicains",              bloc: droite }
