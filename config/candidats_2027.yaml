  # --- Souverainistes ------------------------------------------------------
  NDA:  { nom: "Nicolas Dupont-Aignan",   parti: "Debout la France",              bloc: souverainiste }
  PdV:  { nom: "Philippe de Villiers",    parti: "Divers droite souverainiste",   bloc: souverainiste }
  # Independent, no party. Tested once, at 0.5%, by OpinionWay (2026-09-02/04)
  # in a survey he commissioned himself. The bloc is a JUDGEMENT, not a data
  # field: upstream records no party, and his platform is described as popular
  # sovereigntism with economic liberalism and a rejection of the party
  # system (candidator.fr). Souverainiste is the nearest fit. At half a point
  # the choice barely touches anyone else; revisit if he polls materially.
  SB:   { nom: "Sébastien Bonnal",        parti: "Indépendant",                   bloc: souverainiste }

  # --- Droite nationale (Reconquête et alliés) -----------------------------
  EZ:   { nom: "Éric Zemmour",            parti: "Reconquête",                    bloc: reconquete }
  SK:   { nom: "Sarah Knafo",             parti: "Reconquête",                    bloc: reconquete }
  MM:   { nom: "Marion Maréchal",         parti: "Identité-Libertés",             bloc: reconquete }
  RM:   { nom: "Robert Ménard",           parti: "Divers droite nationale",       bloc: reconquete }
  # Ciotti's UDR is allied with the RN, but he has never been tested as a
  # presidential candidate alongside Le Pen or Bardella, so there is no
  # substitution evidence either way. Placed in the nearest non-RN nest.
  EC:   { nom: "Éric Ciotti",             parti: "UDR",                           bloc: reconquete }

  # --- Rassemblement national -----------------------------------------------
  MLP:  { nom: "Marine Le Pen",           parti: "Rassemblement national",        bloc: rn }
