# Model configuration. Nothing in src/ hard-codes a prior or a hyperparameter:
# if a number governs the arithmetic, it lives here.

schema_version: 1

election:
  # Dates set by the decret de convocation (Constitution art. 7). The second
  # round is always the 14th day after the first.
  premier_tour: 2027-04-18
  second_tour: 2027-05-02
  # Candidacies close once the Conseil constitutionnel has validated the 500
  # parrainages. Before this date the ballot is genuinely uncertain and the
  # field simulation carries that; after it, the field is known and the
  # arbitrations collapse to their observed outcome.
  cloture_candidatures: 2027-03-12

polls:
  # The 2024 snap legislative election reset the party system: Renaissance
  # lost its majority, the RN became the largest single party, and the
  # candidate field for 2027 only starts being tested afterwards. Polls before
  # this are about a different question.
  history_start: 2024-07-08
  # A grid step. Weekly is enough for a 30-month horizon and keeps the latent
  # state small; the random-walk variance scales with the step length.
  grid_days: 7

latent:
  # Innovation SD per day on the log-strength scale.
  #
  # FITTED, and horizon-matched. scripts/fit_walk_scale.py measures how much a
  # candidate's log share moved between polls by the SAME institute in the 2022
  # cycle, net of sampling noise, non-rolling polls only.
  #
  # THE WALK IS NOT A RANDOM WALK. A Gaussian walk implies movement scales as
  # sqrt(time), so sigma/day must be identical at every gap length. It is not:
  #
  #     gap (days)   sigma/day   implied over 221 days
  #       7-21        0.0157           0.234
  #      22-45        0.0307           0.457
  #      46-90        0.0290           0.431
  #      91-150       0.0261           0.388
  #     151-260       0.0222           0.329   <- fitted
  #
  # Short gaps understate, because an institute reuses panels and methods and
  # two readings a fortnight apart are more alike than two independent draws on
  # the same opinion. Long gaps come back down: mean reversion, a candidate who
  # surges gives some of it back.
  #
  # MEASURED CONSEQUENCE. The first fit used 7-60 day gaps and gave 0.0142/day.
  # The 2022 backtest at 221 days out then covered only 67% of outcomes in its
  # 90% intervals and 25% in its 50% intervals - the forecast was overconfident
  # because the walk had been calibrated at a horizon it is never used at.
  #
  # So the band is matched to the distance the walk actually has to cover, from
  # the last poll to election day. Same principle as the election-day error,
  # which is fitted on final polls because that is where it is applied.
  #
  #     total rw_sd_per_day = 0.0222   90% CI [0.0215, 0.0227]   (2049 pairs)
  #
  # Split in quadrature between the bloc walk and the candidate walk:
  #     sqrt(0.0178^2 + 0.0133^2) = 0.0222
  # tests/test_calibration.py asserts the split still reconciles. Re-run the
  # script and update all three numbers together.
  rw_sd_per_day_prior: 0.0178
  # Prior SD on a candidate's strength at the start of the window.
  initial_sd: 1.50
  # Blocs move together: a bloc-level walk shared by its members, plus each
  # candidate's own deviation. Set the bloc term to 0 to make candidates
  # independent (and see the ESS collapse - the common component has to live
  # somewhere).
  bloc_rw_sd_per_day_prior: 0.0133
  # The measured total the two above must reconcile to. Documentation for the
  # test, not a model input.
  fitted_total_rw_sd_per_day: 0.0222
  # Hold the walk scales AT the measured values instead of sampling them.
  #
  # MEASURED, then decided. Left free, the posterior walk was 0.0337/day
  # against a measured value less than half that, while sigma_excess collapsed
  # to 0.0011 - the walk was absorbing observation noise, because a 146-node
  # grid is far more flexible than a single noise term and 39 surveys cannot
  # separate them. Set this false to reproduce that.
  pin_walk_scales: true

nesting:
  # The nesting parameter lambda_k of a nested logit, one per bloc.
  #
  #   lambda -> 0   perfect substitution inside the bloc. Removing Le Pen from
  #                 the ballot sends essentially all of her support to
  #                 Bardella and leaves the RN total unchanged.
  #   lambda  = 1   independence of irrelevant alternatives. Removing Le Pen
  #                 redistributes her support proportionally across every
  #                 other candidate, including Melenchon. This is what a plain
  #                 softmax over candidates assumes, and it is wrong.
  #
  # Beta(2, 4) has mean 1/3 and puts most mass below 0.6, encoding the prior
  # that within-bloc substitution is strong but not total. The data identify
  # this wherever a bloc has been tested both with and without a member -
  # which for the RN and the centre is most of the file.
  prior_a: 2.0
  prior_b: 4.0
  # A bloc with only one candidate ever polled has no within-bloc variation to
  # identify lambda from, so it is pinned rather than left to wander on its
  # prior.
  pin_singleton_blocs: true

house_effects:
  # Per institute x bloc, on the log-strength scale, ZeroSumNormal across
  # institutes within each bloc.
  #
  # INVARIANT: these must stay sum-to-zero. Without the constraint a constant
  # moves freely between the house effects and the latent strengths for an
  # identical likelihood, and the sampler wanders along that ridge.
  #
  # Per institute x *bloc*, not per institute x candidate: eight institutes by
  # 26 candidates is 208 parameters against 165 first-round hypotheses, and
  # the systematic differences between French institutes are about how they
  # treat the RN vote and the abstention screen, which is a bloc-level story.
  sd_prior: 0.12

observation:
  # Non-sampling noise beyond what the stated sample size explains, on the
  # share scale.
  #
  # ASSERTED, not fitted - this is only the prior scale, and the model
  # estimates the parameter itself from the 2027 polls (posterior ~0.0034).
  # `calibrate` fits the election-day error, not this one. Do not label it
  # FITTED unless that changes.
  excess_sd_prior: 0.018
  # An institute testing 13 hypotheses has not run 13 surveys: it asked one
  # sample of ~1500 people about 13 candidate fields. Treating them as
  # independent would multiply that sample by 13.
  #
  # Each hypothesis in a survey of m hypotheses gets its effective sample
  # scaled by m^-(this). 1.0 divides the sample evenly between hypotheses
  # (fully redundant); 0.0 treats each as a fresh survey (fully independent).
  # The truth is in between: the hypotheses share respondents but genuinely
  # ask different questions.
  #
  # TESTED ACROSS ITS WHOLE RANGE, and the forecast turns out not to care.
  #
  # It cannot be measured directly: comparing hypotheses within one survey
  # confounds redundancy with the thing being modelled, since different fields
  # *should* give different shares. So it was fitted against out-of-sample
  # performance instead - scripts/fit_survey_weight.py runs the 2022 backtest at
  # two cutoffs for exponents 0.00, 0.35, 0.65 and 1.00, holding everything
  # else fixed, and scores with CRPS.
  #
  #   cutoff        0.00    0.35    0.65    1.00
  #   221 days     2.003   2.032   2.072   2.089
  #    30 days     2.078   2.059   2.066   2.052
  #
  # The two cutoffs rank it EXACTLY OPPOSITELY, which is the signature of noise
  # rather than signal. A paired check on per-candidate error agrees: the
  # extremes differ in opposite directions at the two horizons (8 of 12
  # candidates one way, 4 of 12 the other, against a 6 of 12 null), with mean
  # paired differences of -0.0008 and +0.0004.
  #
  # The clincher is interval width. Moving from 0.00 to 1.00 changes the
  # effective sample by about fivefold and changes the median candidate's 90%
  # interval from 4.96 points to 4.95. Ratio 1.00.
  #
  # WHY. The forecast's width is set by what happens AFTER the last poll - the
  # random walk to election day, and the fitted election-day error. Per-poll
  # noise governs how tightly the latent state tracks history, and with 40-odd
  # surveys that path is well determined either way.
  #
  # So 0.65 stays: mid-range, defensible, and demonstrably not load-bearing.
  # This also KILLED a plausible hypothesis - that over-weighting poll noise
  # made the model sluggish and explained the backtest missing Melenchon's late
  # surge. It does not; that miss is still unexplained.
  survey_weight_exponent: 0.65
  # Sample universe. French notices describe who was sampled ("population
  # francaise agee de 18 ans et plus", "residents de France metropolitaine"),
  # which is a universe rather than a likely-voter screen - unlike US polls
  # there is no LV/RV distinction to model here. The effect is kept because
  # the metropolitan-only universe excludes the overseas departements, which
  # vote differently. "auto" pins the modal universe to zero as the reference.
  reference_population: auto

election_day_error:
  # How wrong the polls are on the day, over and above sampling noise.
  #
  # Split, not stacked: this is the error of an institute's FINAL poll, where
  # the miss is systematic. Opinion change between now and April 2027 is
  # already carried by the random walk running to election day, so a
  # longer-horizon figure would count drift twice. Measured on 2022: every
  # poll in the closing fortnight gives a log-error SD of 0.310, final polls
  # alone give 0.247 - the gap is Melenchon's late surge, which is movement,
  # not polling error.
  #
  # --- FITTED by `presidentielle calibrate` --------------------------------
  # 2022 cycle, 11 institutes' final polls, scored on the Ministry of the
  # Interior's proclaimed result (config/resultats_2022.yaml).
  #
  #   log-error SD, candidates >= 5%      0.2007   <- sets the value below
  #   log-error SD, everyone above 2%     0.2473
  #   mean signed log error              -0.0064   (no whole-field bias)
  #
  # Stored on the share scale at p = 0.25, which is how simulate.py converts
  # it back: 0.2007 * 0.25 * 0.75 = 0.0376. The previous value, 0.0220, was
  # invented, under a comment claiming it had been fitted by a command that
  # did not exist.
  #
  # Fitted on candidates at or above 5% because the model applies ONE constant
  # error on the log scale while real error is not constant there: the
  # proportional miss is larger for small candidates (0.247 against 0.201).
  # The forecast turns on who reaches the runoff and who wins it, so the
  # majors set the scale, and minor candidates' proportional uncertainty is
  # understated - a stated simplification, not a discovery waiting to happen.
  #
  # ONE CYCLE. 2022 is all nsppolls covers, so this measures a single election
  # rather than averaging several. Re-run `calibrate` when another exists.
  r1_fitted: true
  r1_share_error_sd: 0.0376
  # --- NOT FITTED: a prior that nothing identifies -------------------------
  # Errors ought to correlate inside a bloc - an institute under-reading the RN
  # under-reads every RN candidate at once. The 2022 field cannot show it: only
  # TWO same-bloc pairs clear the 2% floor (Melenchon/Roussel, Lassalle/
  # Dupont-Aignan), and the measured excess correlation against those was zero.
  # Zero here is an absence of data, not evidence of independence.
  #
  # Kept modest rather than at the 0.55 originally asserted. It is second-order
  # either way: under the arbitration model the RN and Reconquete field ONE
  # candidate at a time, so this only bites where a bloc runs two at once -
  # currently just the centre. Higher values widen a bloc's combined total.
  bloc_error_corr: 0.30
  # --- NOT FITTED: informed by a single observation ------------------------
  # 2022's final polls under-read Macron's runoff share by 3.94 points. That is
  # one matchup in one cycle and cannot give a distribution, but a 3.9-point
  # miss is an ordinary draw from an SD of 0.030, so the prior is at least not
  # contradicted by the only evidence available.
  r2_margin_error_sd: 0.030

second_tour:
  # Transfer rates: of the voters who chose a first-round candidate in bloc j,
  # what share go to each finalist. Priors come from the 2022 measured
  # transfers (nsppolls reports.csv); runoff hypothesis polls update them
  # wherever a matchup has actually been tested.
  transfer_concentration: 40.0
  # Prior scale for the 2022 front republicain term, which the measured 2022
  # transfers then pin down.
  rn_transfer_extra_sd: 0.08
  # How far the 2027 front republicain may differ from the fitted value,
  # applied per simulated world in simulate.py rather than fitted.
  #
  # ASSERTED, and unavoidably so: measuring it needs two cycles of transfers
  # and only one exists. It is the honest home for the model's largest
  # substantive uncertainty, and it is applied at simulation time precisely so
  # that the 54 hypothetical 2027 matchups cannot fit it away and report
  # today's stated intentions as knowledge about May 2027.
  #
  # Setting it to 0 asserts that 2027 will behave exactly as the polls say -
  # which is the assumption this parameter exists to stop being made silently.
  #
  # CHOSEN AGAINST A YARDSTICK, not picked. The only evidence about how far
  # this moves between cycles is how far it has moved: the RN's runoff share
  # went 34.14% in 2017 to 41.45% in 2022, +7.3 points in one cycle. (The 2017
  # figure is the Ministry's election-night publication, which is provisional;
  # it is used here only to size a prior.)
  #
  # scripts/check_runoff_sensitivity.py translates this parameter into that
  # same unit. At 0.45 a one-sigma move is about 4 points of runoff share, so
  # the one cycle transition anyone has observed sits near 1.8 sigma - an
  # ordinary draw rather than an extreme one. At the 0.35 first tried it would
  # have been a 2.4 sigma event, i.e. the model would have called the only
  # thing that has actually happened close to implausible.
  front_republicain_2027_sd: 0.45

field:
  # Who is actually on the ballot. Rather than invent probabilities, the
  # default is empirical: how often pollsters have recently tested each
  # candidate is itself evidence about who is expected to run - institutes
  # test the fields their clients think plausible.
  #
  # Overridden by hard facts (an announced withdrawal, a validated candidacy)
  # from the roster's annonce_candidature / retrait_candidature fields.
  source: "hypothesis_frequency"
  # Recent hypotheses count for more, with exponential decay.
  #
  # MEASURED, and the reason this is a half-life rather than a window. The RN
  # testing pattern is a step function, not noise. Le Pen was declared
  # ineligible on 2025-03-31 and institutes switched to testing Bardella:
  # April 2025 to June 2026 he appears in 62-100% of monthly fields. Her ban
  # was cut to 15 months on 2026-07-07, and from July 2026 onward she appears
  # in 100% of fields and he appears in none.
  #
  # A flat 120-day window spans the break and reports Le Pen 67% / Bardella
  # 33%. The last three months are unanimous. A short half-life tracks the
  # regime change; a window averages across it and gets the RN nomination -
  # the single most consequential fact about this ballot - badly wrong.
  half_life_days: 45
  # Shrink towards even odds so a thin recent window cannot produce a
  # near-certainty. Pseudo-counts added to each option in an arbitration.
  shrinkage_pseudocounts: 1.0
  # Declared candidacies and withdrawals from candidats.csv are applied
  # automatically and beat the frequency proxy - see
  # src/presidentielle/data/candidacies.py. This matters: Bardella withdrew on
  # 2026-07-07, the day Le Pen's ban was cut, and the frequency estimate alone
  # still gave him a 20% chance of standing.
  #
  # A withdrawal is decisive. A declaration only sets this floor, because a
  # declared candidate still needs 500 parrainages and can change their mind -
  # Darmanin declared on 2026-08-17 and withdrew eight days later.
  declared_floor: 0.85
  # Presence probabilities the data cannot know, keyed by candidate id. These
  # win over everything, including the declarations above. Use only for facts,
  # with the source in the comment - never to express a hunch.
  overrides: {}
    # Example, after the Conseil constitutionnel publishes the parrainages:
    # JB: 0.0   # withdrew in favour of Le Pen, [source]

sampling:
  draws: 1000
  tune: 1000
  chains: 4
  target_accept: 0.92
  seed: 20270418
  # Simulation draws per posterior sample when propagating to the ballot,
  # election-day error and the runoff.
  sims_per_draw: 20
